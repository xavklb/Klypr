# Configuration de Klypr

[General]
# Espacement entre les fenêtres pavées (en pixels)
gap_size = 8
# Épaisseur des bordures des fenêtres
border_width = 2

[Theme]
# Thème du sélecteur d'applications :
# - system    : S'adapte automatiquement au mode sombre/clair de Windows
# - dark      : Thème sombre moderne (Fluent Dark) avec transparence
# - light     : Thème clair moderne (Fluent Light) avec transparence
# - cyberpunk : Style terminal hacker vert néon sur fond sombre
# - dracula   : Thème développeur violet et cyan
theme = system

# Opacité de la fenêtre du sélecteur (en pourcentage, de 50 à 100)
opacity = 95
