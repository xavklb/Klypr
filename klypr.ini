# Configuration de Klypr (Sélecteur d'applications rapide)

[General]
# Lancer Klypr automatiquement au démarrage de Windows (1 = activé, 0 = désactivé)
autostart =1

# Terminal à ouvrir avec Alt+Entrée (ex: wt.exe, powershell.exe, cmd.exe, bash.exe)
# Si absent ou non trouvé, Klypr bascule automatiquement : wt.exe -> Windows Terminal AppX -> PowerShell -> CMD
terminal =wt.exe

# Moteur de recherche web par défaut lorsqu'aucun résultat local n'est trouvé (%s est remplacé par les mots-clés)
# Exemples :
# Google     : https://www.google.com/search?q=%s
# DuckDuckGo : https://duckduckgo.com/?q=%s
# Bing       : https://www.bing.com/search?q=%s
# Qwant      : https://www.qwant.com/?q=%s
search_engine =https://www.google.com/search?q=%s

[Theme]
# Thème du sélecteur d'applications :
# - system    : S'adapte automatiquement au mode sombre/clair de Windows
# - dark      : Thème sombre moderne (Fluent Dark) avec transparence
# - light     : Thème clair moderne (Fluent Light) avec transparence
# - cyberpunk : Style terminal hacker vert néon sur fond sombre
# - dracula   : Thème développeur violet et cyan
theme =dracula

# Opacité de la fenêtre du sélecteur (en pourcentage, de 50 à 100)
opacity =95

[Aliases]
# Définissez vos alias personnalisés ici.
# Format : nom = commande, application, dossier ou URL
# Vous pouvez utiliser %s pour insérer des arguments dynamiques (ex: recherche web ou arguments de commande)
#
# Exemples pratiques :
g =https://www.google.com/search?q=%s
yt =https://www.youtube.com/results?search_query=%s
gh =https://github.com/search?q=%s
proj =explorer.exe C:\Users\xavier.kolb.sta\Documents\Projets
term =wt.exe
chrome=chrome.exe
